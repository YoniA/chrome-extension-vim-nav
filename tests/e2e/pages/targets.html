<!doctype html>
<html><head><meta charset="utf-8"><title>Targets</title>
<style>body { height: 3000px; font: 16px sans-serif; } p { margin: 12px; }</style></head>
<body>
<p><a id="link" href="target.html">a link</a></p>
<p><button id="btn" onclick="this.dataset.clicks = (+this.dataset.clicks || 0) + 1">Count</button></p>
<p><input id="name" type="text" placeholder="name"></p>
<p><label><input id="check" type="checkbox"> remember me</label></p>
<p><textarea id="notes"></textarea></p>
<p><select id="fruit"><option>apple</option><option>banana</option></select></p>
<p><button id="off" disabled>Disabled</button></p>
<p><span id="fake" role="button" tabindex="0" onclick="this.dataset.clicks = 1">Fake button</span></p>
</body></html>
