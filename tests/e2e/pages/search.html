<!doctype html>
<html><head><meta charset="utf-8"><title>Search</title>
<style>body { font: 16px sans-serif; margin: 8px; } .gap { height: 3000px; }</style></head>
<body>
<p id="p1">foo at the top</p>

  window.pageKeys = [];
  document.addEventListener('keydown', (e) => pageKeys.push(e.key));
</script>
