<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Inner scroll page</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; font: 16px/1.5 sans-serif; }
    header { height: 60px; padding: 0 2rem; }
    main { height: calc(100% - 60px); overflow-y: auto; padding: 0 2rem; }
    section { height: 600px; border-bottom: 1px solid #ccc; }
  </style>
</head>
<body>
  <header><h1>Inner scroll page</h1></header>
  <main id="scroller">
    <p>The page itself doesn't scroll; this inner element does, like many web apps.</p>
    <section>Section 1</section>
    <section>Section 2</section>
    <section>Section 3</section>
    <section>Section 4</section>
    <p>Bottom of the inner scroller</p>
  </main>
</body>
</html>
